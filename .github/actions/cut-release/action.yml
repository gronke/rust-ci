name: Cut release
description: >-
  Start a release for the version Cargo.toml declares, or the `version` input where there is no crate: cut the changelog's [Unreleased] section, push the release branch, stamp the citation file where the repository keeps one, open the merge-back pull request, and dispatch the release pipeline on the branch.
  Refuses when the release branch already exists.

inputs:
  branch-prefix:
    description: The release branch name is this prefix plus the version.
    required: false
    default: "release/v"
  base:
    description: Base branch of the merge-back pull request (defaults to the repository's default branch).
    required: false
    default: ""
  pipeline-workflow:
    description: Workflow file to dispatch on the release branch; empty skips the dispatch.
    required: false
    default: "release.yml"
  merge-back:
    description: Open the merge-back pull request.
    required: false
    default: "true"
  package:
    description: Package name (required for a workspace with more than one member).
    required: false
    default: ""
  version:
    description: >-
      The version to release, overriding Cargo.toml resolution. Required for a
      repository without a Cargo.toml.
    required: false
    default: ""
  working-directory:
    description: Directory containing the crate or workspace.
    required: false
    default: "."
  changelog:
    description: Changelog path, relative to the working directory.
    required: false
    default: "CHANGELOG.md"
  date:
    description: The date stamped on the released section and the citation file (defaults to today, UTC).
    required: false
    default: ""
  citation:
    description: >-
      Citation File Format path, relative to the working directory; the cut stamps its top-level `version`, and `date-released` where the file keeps one.
      A missing file is skipped, an empty value disables the stamp.
    required: false
    default: "CITATION.cff"
  token:
    description: Token for the push, the merge-back pull request, and the dispatch.
    required: false
    default: ${{ github.token }}
  git-user-name:
    description: Committer identity for the release commit.
    required: false
    default: "github-actions[bot]"
  git-user-email:
    description: >-
      Committer email for the release commit; the default is the github-actions bot's canonical address.
      Pass a machine-user or App identity together with a matching token when the merge-back pull request must trigger CI, which events created with the workflow token do not.
    required: false
    default: "41898282+github-actions[bot]@users.noreply.github.com"
  dry-run:
    description: >-
      Derive the version and branch and cut the changelog in the working tree,
      but push nothing, open nothing, and dispatch nothing.
    required: false
    default: "false"

outputs:
  version:
    description: The released version, from Cargo.toml.
    value: ${{ steps.cut.outputs.version }}
  branch:
    description: The release branch name.
    value: ${{ steps.cut.outputs.branch }}

runs:
  using: composite
  steps:
    - name: Cut the release branch
      id: cut
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_BRANCH_PREFIX: ${{ inputs.branch-prefix }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_PIPELINE_WORKFLOW: ${{ inputs.pipeline-workflow }}
        INPUT_MERGE_BACK: ${{ inputs.merge-back }}
        INPUT_PACKAGE: ${{ inputs.package }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_CHANGELOG: ${{ inputs.changelog }}
        INPUT_DATE: ${{ inputs.date }}
        INPUT_CITATION: ${{ inputs.citation }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_GIT_USER_NAME: ${{ inputs.git-user-name }}
        INPUT_GIT_USER_EMAIL: ${{ inputs.git-user-email }}
        GH_TOKEN: ${{ inputs.token }}
      run: bash "$GITHUB_ACTION_PATH/cut-release.sh"
