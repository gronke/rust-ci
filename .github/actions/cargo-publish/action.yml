name: Cargo publish
description: >-
  Publish the crate to crates.io — or rehearse it. `publish` is "false" by
  default, which runs `cargo publish --dry-run` and reads no credential at all,
  so the step is safe anywhere in a pipeline. With `publish: true` the version
  is checked against crates.io first and then uploaded, which is irreversible
  (a published version can only be yanked, never replaced), so it belongs
  behind whatever human gate the repository uses — a signed tag, an
  environment with reviewers, or both.

  Credentials: prefer crates.io Trusted Publishing — put
  `rust-lang/crates-io-auth-action` ahead of this step (with `id-token: write`)
  and it exports a short-lived `CARGO_REGISTRY_TOKEN` this action picks up, so
  no long-lived secret is stored. `registry-token` is the fallback for a
  classic API token from a repository or organization secret.

  This publishes the *crate*. Publishing the GitHub Release is
  `publish-draft-release`.

inputs:
  publish:
    description: >-
      "true" uploads to crates.io. Anything else (the default) runs
      `cargo publish --dry-run` and touches no credential.
    required: false
    default: "false"
  registry-token:
    description: >-
      crates.io API token, named after cargo's own CARGO_REGISTRY_TOKEN. Leave
      empty when Trusted Publishing (or a job-level env of that name) already
      provides one. Required for an upload when neither does.
    required: false
    default: ""
  package:
    description: Workspace member to publish; empty resolves the sole package.
    required: false
    default: ""
  locked:
    description: Pass `--locked`, so the committed Cargo.lock is what gets published.
    required: false
    default: "true"
  allow-already-published:
    description: >-
      When the version is already on crates.io: "true" skips with a notice
      (idempotent re-runs), otherwise the step fails.
    required: false
    default: "false"
  working-directory:
    description: Directory of the checked-out repository.
    required: false
    default: "."

outputs:
  published:
    description: '"true" when this run uploaded to crates.io.'
    value: ${{ steps.publish.outputs.published }}
  version:
    description: The crate version the step acted on.
    value: ${{ steps.publish.outputs.version }}
  already-published:
    description: '"true" when the version was already on crates.io.'
    value: ${{ steps.publish.outputs.already-published }}

runs:
  using: composite
  steps:
    - name: Publish to crates.io
      id: publish
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_PUBLISH: ${{ inputs.publish }}
        INPUT_REGISTRY_TOKEN: ${{ inputs.registry-token }}
        INPUT_PACKAGE: ${{ inputs.package }}
        INPUT_LOCKED: ${{ inputs.locked }}
        INPUT_ALLOW_ALREADY_PUBLISHED: ${{ inputs.allow-already-published }}
      run: bash "$GITHUB_ACTION_PATH/cargo-publish.sh"
