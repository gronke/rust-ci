name: Cargo publish
description: >-
  Publish the crate to crates.io, or rehearse it.
  `publish` defaults to "false", which runs `cargo publish --dry-run` and reads no credential.
  With `publish: true` only a version matching `tag-pattern` (stable vX.Y.Z by default) is checked against crates.io and uploaded; run it behind `require-signed-tag` on the tag ref.
  Pass the `token` output of rust-lang/crates-io-auth-action as `registry-token`, or a classic token.

inputs:
  publish:
    description: >-
      "true" uploads to crates.io. Anything else (the default) runs
      `cargo publish --dry-run` and touches no credential.
    required: false
    default: "false"
  tag-pattern:
    description: >-
      Extended regex `v<version>` (resolved from the manifest) must match to be published; the default admits only stable vX.Y.Z releases.
      A non-matching version is a notice and a skip, not a failure; empty disables the check.
    required: false
    default: "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
  registry-token:
    description: >-
      crates.io API token: the `token` output of rust-lang/crates-io-auth-action, or a classic token from a secret.
      Leave empty when a job-level CARGO_REGISTRY_TOKEN already provides one.
    required: false
    default: ""
  package:
    description: Workspace member to publish; empty resolves the sole package.
    required: false
    default: ""
  locked:
    description: Pass `--locked`, so the committed Cargo.lock is what gets published.
    required: false
    default: "true"
  allow-already-published:
    description: >-
      When the version is already on crates.io: "true" skips with a notice, otherwise the step fails.
      The check precedes the credential, so an idempotent re-run needs no token.
    required: false
    default: "false"
  working-directory:
    description: Directory of the checked-out repository.
    required: false
    default: "."

outputs:
  published:
    description: '"true" when this run uploaded to crates.io.'
    value: ${{ steps.publish.outputs.published }}
  version:
    description: The crate version the step acted on.
    value: ${{ steps.publish.outputs.version }}
  already-published:
    description: '"true" when the version was already on crates.io.'
    value: ${{ steps.publish.outputs.already-published }}

runs:
  using: composite
  steps:
    - name: Publish to crates.io
      id: publish
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_PUBLISH: ${{ inputs.publish }}
        INPUT_TAG_PATTERN: ${{ inputs.tag-pattern }}
        INPUT_REGISTRY_TOKEN: ${{ inputs.registry-token }}
        INPUT_PACKAGE: ${{ inputs.package }}
        INPUT_LOCKED: ${{ inputs.locked }}
        INPUT_ALLOW_ALREADY_PUBLISHED: ${{ inputs.allow-already-published }}
      run: bash "$GITHUB_ACTION_PATH/cargo-publish.sh"
