name: crates mirror
description: >-
  Route cargo's crates-io source through a mirror by writing the source replacement into $CARGO_HOME/config.toml; source replacement is config-file-only (cargo#5416).
  The URL comes from the url input or from RUST_CI_CRATES_MIRROR in the job environment; "auto" is a no-op without one, so hosted runners keep fetching from crates.io directly.
  Cargo.lock keeps the canonical crates.io checksums and cargo verifies every download against them, so the mirror can refuse to serve, never alter what a build consumes.
  Place it before the first step that resolves dependencies; an existing crates-io replacement is refused rather than fought, and a workspace .cargo/config.toml still wins by cargo's own rules.
  Runner-native and container jobs only; the sealed Docker actions pin CARGO_HOME and build offline.

inputs:
  mode:
    description: >-
      "auto" activates when a mirror URL is given, "on" requires one and fails without, "off" changes nothing.
    required: false
    default: auto
  url:
    description: >-
      Explicit mirror URL (sparse+http(s)://.../); overrides RUST_CI_CRATES_MIRROR.
    required: false
    default: ""

outputs:
  active:
    description: '"true" when the source replacement was written (or already present and identical).'
    value: ${{ steps.mirror.outputs.active }}

runs:
  using: composite
  steps:
    - name: Route crates-io through the mirror
      id: mirror
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        URL: ${{ inputs.url }}
      run: bash "$GITHUB_ACTION_PATH/crates-mirror.sh"
