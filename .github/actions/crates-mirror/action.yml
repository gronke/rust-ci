name: crates mirror
description: >-
  Route cargo's crates-io source through a mirror by writing the source replacement into $CARGO_HOME/config.toml.
  The URL comes from the url input or from RUST_CI_CRATES_MIRROR in the job environment; "auto" is a no-op without one.
  Cargo.lock keeps the canonical crates.io checksums, so the mirror cannot alter what a build consumes.
  Place it before the first step that resolves dependencies.

inputs:
  mode:
    description: >-
      "auto" activates when a mirror URL is given, "on" requires one and fails without, "off" changes nothing.
    required: false
    default: auto
  url:
    description: >-
      Explicit mirror URL (sparse+http(s)://.../); overrides RUST_CI_CRATES_MIRROR.
    required: false
    default: ""

outputs:
  active:
    description: '"true" when the source replacement was written (or already present and identical).'
    value: ${{ steps.mirror.outputs.active }}

runs:
  using: composite
  steps:
    - name: Route crates-io through the mirror
      id: mirror
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        URL: ${{ inputs.url }}
      run: bash "$GITHUB_ACTION_PATH/crates-mirror.sh"
