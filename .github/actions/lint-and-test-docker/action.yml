name: Lint and test (Docker, sealed)
description: >-
  Run cargo fmt --check, clippy (-D warnings) and test inside the pinned container, sealed with --network none against the cache a prior cargo-fetch populated.
  Runs --offline --locked; the workdir is read-only, target and cache are read-write.

inputs:
  image:
    description: CI image (Rust toolchain + clippy/rustfmt).
    required: false
    default: rust-ci:latest
  working-directory:
    description: Crate/workspace directory (mounted read-only).
    required: false
    default: "."
  target-dir:
    description: Host dir for cargo target (read-write, cacheable).
    required: false
    default: target
  cargo-cache:
    description: Host dir for CARGO_HOME (read-write; populated by cargo-fetch).
    required: false
    default: .cargo-cache
  features:
    description: Feature flag applied to clippy + test (e.g. --all-features).
    required: false
    default: ""
  offline:
    description: >-
      Run sealed: --network none plus cargo --offline, which needs a prior cargo-fetch to populate the cache.
      Set "false" to run networked and fetch as it builds, skipping the warmup.
    required: false
    default: "true"
  env-include:
    description: Regex (POSIX ERE) of runner variable names to forward, anchored full-name; see docs/sealed-builds.md.
    required: false
    default: "CARGO_.*"
  env-exclude:
    description: Regex (POSIX ERE) of names to drop from the included set (exclusion wins); see docs/sealed-builds.md.
    required: false
    default: ""
  env:
    description: Literal KEY=VALUE lines forwarded verbatim; a bare NAME line forwards that variable from the runner environment; see docs/sealed-builds.md.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: lint + test (sealed)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IMAGE: ${{ inputs.image }}
        TARGET_DIR: ${{ inputs.target-dir }}
        CARGO_CACHE: ${{ inputs.cargo-cache }}
        FEATURES: ${{ inputs.features }}
        OFFLINE: ${{ inputs.offline }}
        ENV_INCLUDE: ${{ inputs.env-include }}
        ENV_EXCLUDE: ${{ inputs.env-exclude }}
        INPUT_ENV: ${{ inputs.env }}
        # The sealed gate's fixed shape: every step on, clippy over all targets, --locked.
        FMT: "true"
        CLIPPY: "true"
        TEST: "true"
        CLIPPY_ARGS: --all-targets
        LOCKED: "true"
      run: |
        set -euo pipefail
        # shellcheck source=/dev/null
        source "$GITHUB_ACTION_PATH/../_lib/seal.sh"
        # The script is the native lint-and-test action's; mount that directory at /cicd.
        CICD_DIR="$(cd "$GITHUB_ACTION_PATH/../lint-and-test" && pwd)"
        export CICD_DIR
        # None of these are CARGO_* (env-include won't forward them); hand them to the
        # in-container script. seal_run also reads OFFLINE for --network.
        export SEAL_PASS="FMT CLIPPY TEST CLIPPY_ARGS LOCKED OFFLINE FEATURES"
        seal_run bash /cicd/lint-and-test.sh
