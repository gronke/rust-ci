name: Cargo fetch (Docker)
description: >-
  Populate the cargo registry and git cache inside the pinned container, as the one networked step, so the following actions can run sealed (--network none, --offline).
  Requires a committed Cargo.lock (runs --locked).

inputs:
  image:
    description: CI image (Rust toolchain + clippy/rustfmt + jq).
    required: false
    default: rust-ci:latest
  working-directory:
    description: Crate/workspace directory (mounted read-only).
    required: false
    default: "."
  cargo-cache:
    description: Host dir for CARGO_HOME (registry/git cache; read-write, cacheable).
    required: false
    default: .cargo-cache
  env-include:
    description: Regex (POSIX ERE) of runner variable names to forward, anchored full-name; see docs/sealed-builds.md.
    required: false
    default: "CARGO_.*"
  env-exclude:
    description: Regex (POSIX ERE) of names to drop from the included set (exclusion wins); see docs/sealed-builds.md.
    required: false
    default: ""
  env:
    description: Literal KEY=VALUE lines forwarded verbatim; a bare NAME line forwards that variable from the runner environment; see docs/sealed-builds.md.
    required: false
    default: ""
  git-token:
    description: >-
      Token for cloning private git dependencies inside the container: when set, git is configured (url.insteadOf) to authenticate github.com fetches as x-access-token and cargo is forced to fetch via the git CLI.
      Pass a secret carrying contents:read on the dependency repos; leave empty for public deps.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: cargo fetch (networked)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IMAGE: ${{ inputs.image }}
        CARGO_CACHE: ${{ inputs.cargo-cache }}
        ENV_INCLUDE: ${{ inputs.env-include }}
        ENV_EXCLUDE: ${{ inputs.env-exclude }}
        INPUT_ENV: ${{ inputs.env }}
        GIT_TOKEN: ${{ inputs.git-token }}
      run: |
        set -euo pipefail
        # shellcheck source=/dev/null
        source "$GITHUB_ACTION_PATH/../_lib/seal.sh"
        # shellcheck source=/dev/null
        source "$GITHUB_ACTION_PATH/../_lib/retry-transient.sh"
        # The one networked step: OFFLINE unset → no --network=none; no target mount
        # (fetch only populates the cache). Forward a private-git token as one masked
        # env-file line (not via env-include); add-mask redacts it from logs.
        if [ -n "$GIT_TOKEN" ]; then
          printf '::add-mask::%s\n' "$GIT_TOKEN"
          export EXTRA_ENV="CICD_GIT_TOKEN=$GIT_TOKEN"
        fi
        # cargo fetch is incremental, so a retry after a crates.io blip resumes off the cache.
        retry_transient seal_run bash -c '
          # With a git-token, authenticate github.com fetches as x-access-token and
          # force cargo to fetch via the git CLI so the url.insteadOf rewrite applies,
          # which lets cargo clone PRIVATE git dependencies. No-op for public deps.
          if [ -n "${CICD_GIT_TOKEN:-}" ]; then
            git config --global url."https://x-access-token:${CICD_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
            export CARGO_NET_GIT_FETCH_WITH_CLI=true
          fi
          exec cargo fetch --locked
        '
