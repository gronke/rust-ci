name: Release guidance
description: >-
  Tell the release manager what to do with the draft pre-release, in the
  place they are already looking: the run's step summary. Three blocks —
  accept, reject (delete the draft and branch; nothing is consumed), and what
  goes live next. `go-live` picks the accept road: "signed-tag" renders the
  sign-and-push runbook; "publish-draft" renders merge-then-publish — the
  admin publishing the draft creates the tag and is the flow's one human gate
  — plus the optional signed vX.Y.Z-sig attestation companion. In
  publish-draft mode the step errors at candidate time when an active tag
  ruleset still requires signatures on the version itself, so CI never sets
  up a tag the repository's own policy rejects — or one a bypass would let
  fail the gate after the release is live. Run it as the last step of a
  successful candidate build.

inputs:
  version:
    description: The version the draft pre-release carries (no leading "v").
    required: true
  marker-tag:
    description: The candidate marker tag this build created (e.g. v1.2.3-rc2).
    required: true
  commit:
    description: The commit the marker sealed — the only commit the final tag may point at.
    required: true
  go-live:
    description: >-
      How the draft goes live: "signed-tag" (default) or "publish-draft".
    required: false
    default: "signed-tag"
  tag-script:
    description: >-
      Repository-relative tagging helper to feature in the accept commands
      (called as `<tag-script> <commit> -s`); plain git commands when empty.
      signed-tag mode only.
    required: false
    default: ""
  draft-url:
    description: URL of the draft release, linked from the summary when set.
    required: false
    default: ""
  token:
    description: Token for the publish-draft mode's tag-ruleset probe.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Write the release guidance
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_MARKER_TAG: ${{ inputs.marker-tag }}
        INPUT_COMMIT: ${{ inputs.commit }}
        INPUT_GO_LIVE: ${{ inputs.go-live }}
        INPUT_TAG_SCRIPT: ${{ inputs.tag-script }}
        INPUT_DRAFT_URL: ${{ inputs.draft-url }}
        GH_TOKEN: ${{ inputs.token }}
      run: bash "$GITHUB_ACTION_PATH/release-guidance.sh"
