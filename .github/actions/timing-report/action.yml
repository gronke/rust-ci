name: Timing report
description: >-
  Render the timing report to the job summary: per-step durations with their share of the job and, where the sampler ran, peak CPU and memory plus a CPU shape per step.
  Steps come from the Actions API and need actions: read; without it the report shows the job totals.
  Run it last with if: always(); it stops the sampler first.

inputs:
  title:
    description: Heading for the summary section.
    required: false
    default: Where the time went
  order:
    description: >-
      "duration" lists the slowest stage first.
      "chronological" keeps step order, for a comparison between two runs.
    required: false
    default: duration
  columns:
    description: Sparkline width per stage. Wider resolves a stage's phases; narrower keeps the table compact.
    required: false
    default: "12"
  token:
    description: >-
      Token used to read the job's per-step timings from the Actions API.
      Needs actions: read; defaults to the job's github.token. Empty skips the API and the report shows the job totals.
    required: false
    default: ${{ github.token }}
outputs:
  report-path:
    description: The rendered Markdown report on disk, for an artifact upload or a diff between two runs.
    value: ${{ steps.report.outputs.report-path }}
  total-ms:
    description: Sum of every stage's duration in milliseconds.
    value: ${{ steps.report.outputs.total-ms }}
  total-seconds:
    description: Sum of every stage's duration.
    value: ${{ steps.report.outputs.total-seconds }}
  slowest-stage:
    description: Name of the longest stage, for a threshold check or an alert; the job's id when the report has no per-step stages.
    value: ${{ steps.report.outputs.slowest-stage }}
  slowest-seconds:
    description: Duration of the longest stage.
    value: ${{ steps.report.outputs.slowest-seconds }}

runs:
  using: composite
  steps:
    - name: Render timing report
      id: report
      shell: bash
      env:
        TITLE: ${{ inputs.title }}
        ORDER: ${{ inputs.order }}
        COLUMNS: ${{ inputs.columns }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: bash "$GITHUB_ACTION_PATH/timing-report.sh"
