name: Timing report
description: >-
  Render the timing report to the job summary: per-stage durations with their share of the job and, where the sampler ran, peak CPU and memory plus a CPU shape per stage.
  Stages come from timing-mark steps or, without marks, from the Actions API with actions: read.
  Run it last with if: always(); it stops the sampler first.

inputs:
  title:
    description: Heading for the summary section.
    required: false
    default: Where the time went
  order:
    description: >-
      "duration" lists the slowest stage first.
      "chronological" keeps step order, for a comparison between two runs.
    required: false
    default: duration
  columns:
    description: Sparkline width per stage. Wider resolves a stage's phases; narrower keeps the table compact.
    required: false
    default: "12"
  token:
    description: >-
      Token used to read the job's per-step timings from the Actions API when the workflow places no timing-mark steps.
      Needs actions: read; defaults to the job's github.token.
    required: false
    default: ${{ github.token }}
outputs:
  report-path:
    description: The rendered Markdown report on disk, for an artifact upload or a diff between two runs.
    value: ${{ steps.report.outputs.report-path }}
  total-seconds:
    description: Sum of every stage's duration.
    value: ${{ steps.report.outputs.total-seconds }}
  slowest-stage:
    description: Name of the longest stage, for a threshold check or an alert.
    value: ${{ steps.report.outputs.slowest-stage }}
  slowest-seconds:
    description: Duration of the longest stage.
    value: ${{ steps.report.outputs.slowest-seconds }}

runs:
  using: composite
  steps:
    - name: Render timing report
      id: report
      shell: bash
      env:
        TITLE: ${{ inputs.title }}
        ORDER: ${{ inputs.order }}
        COLUMNS: ${{ inputs.columns }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: bash "$GITHUB_ACTION_PATH/timing-report.sh"
