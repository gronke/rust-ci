name: Timing start
description: >-
  Start the timing state for a job: record the runner's core count and OS and run a background CPU, memory and disk sampler.
  Pair it with timing-report as an always() last step, which attributes the samples to the job's steps from the Actions API.
  Sampling reads /proc and is Linux-only; elsewhere the report shows durations only.

inputs:
  sample-interval:
    description: Seconds between resource samples. "0" records durations only.
    required: false
    default: "5"

outputs:
  timing-dir:
    description: Directory holding the samples and notes for this job.
    value: ${{ steps.start.outputs.timing-dir }}

runs:
  using: composite
  steps:
    - name: Start timing
      id: start
      shell: bash
      env:
        SAMPLE_INTERVAL: ${{ inputs.sample-interval }}
      run: bash "$GITHUB_ACTION_PATH/timing-start.sh"
