name: Rust cache
description: >-
  Cache cargo for CI without the usual footguns. DEFAULTS incremental compilation off — pure cost in
  CI (no edit→recompile loop) and the main thing that balloons target/ — while OBEYING an explicit
  CARGO_INCREMENTAL the consumer sets (some matrix/variant builds are faster with it on). It does not
  impose a build profile: the build stays cargo's default unless the consumer sets CARGO_* vars, which
  flow through unchanged (incl. into the Docker actions via their CARGO_.* forwarding).

  Two independent cache entries, split by churn rate. The REGISTRY entry (index + .crate tarballs +
  git db, never registry/src — cargo re-extracts it, caching it is pure duplication) is small,
  toolchain-independent and bounded by the Cargo.lock key; it restores here and saves at job end
  unless `save: "false"`. The TARGET entry (opt-in via cache-target) is restore-ONLY here: a
  restore-key fallback plus save-on-new-key would accrete every generation's stale artifacts into
  the next one, so the save lives in the paired `rust-cache-save` action, which prunes target/ down
  to dependency artifacts first and runs as the consumer's LAST job step (composite actions have no
  post hooks, so an auto-save could not run after the build). Jobs that should only consume — PR
  jobs reading what a default-branch warmup maintains — simply omit the save step.

  On a runner whose work tree persists, `local-target` moves target/ out of the workspace and drops
  the transfer entirely.

  Avoids third-party cache actions whose behaviour drifts with the runner image.

inputs:
  prefix:
    description: Cache-family name, so independent jobs (build, tauri, …) keep separate caches.
    required: false
    default: rust
  save:
    description: >-
      Also save the REGISTRY entry at job end (the actions/cache post step). Set "false" for
      restore-only consumers — e.g. PR jobs reading a cache that a default-branch warmup job
      maintains, where per-branch saves would only burn quota and job minutes. The target entry is
      restore-only here regardless; its save belongs to `rust-cache-save`.
    required: false
    default: "true"
  cache-target:
    description: >-
      Also RESTORE the build target/ directory (compiled dependencies between runs). Off by
      default — registry/git alone is small and always safe; turn it on for a heavy dependency tree
      where recompiling every run is the bottleneck. Saving the target back is the paired
      `rust-cache-save` action's job (typically only on the default branch).
    required: false
    default: "false"
  local-target:
    description: >-
      Keep target/ on the runner between jobs instead of transferring it. Requires cache-target.
      Sets CARGO_TARGET_DIR to a directory in the runner's work tree, outside the workspace, and
      skips the target restore and save.

      Outside the workspace because actions/checkout defaults to clean: true and runs
      `git clean -ffdx`, which deletes target/ along with every other ignored file. A target
      directory inside the workspace cannot survive a checkout, however persistent the disk is.

      "auto" activates only when the host leaves a `.rust-ci-local-target` marker beside the
      runner's work directory, so one workflow runs unchanged on a hosted runner (no marker,
      transfer as before) and on a self-hosted one (marker, no transfer). "true" forces it,
      "false" is the default and changes nothing. A job env RUST_CI_LOCAL_TARGET=1 counts as the
      marker, for a workflow that controls its runner but not the host.

      A marker rather than an env var because the runner does not forward its own environment into
      a job container, while the work tree is bind-mounted into it.

      Consumers must read CARGO_TARGET_DIR rather than assume ./target. Only the target entry
      changes; the registry entry still uses actions/cache, because $CARGO_HOME usually lives in the
      toolchain image rather than the work tree. rust-cache-save needs no flag, since this mode
      hands over no key. The directory sits at the work root, is shared per prefix across every repo
      on the runner, and is never pruned: the host owns it and can wipe `.rust-ci-target` to reclaim
      disk.
    required: false
    default: "false"
  target-dir:
    description: Workspace-relative target directory to restore when cache-target is true (e.g. an out-of-workspace crate's target). Ignored when local-target is active.
    required: false
    default: target
  lockfiles:
    description: Glob of lockfile(s) whose hash keys the caches.
    required: false
    default: "**/Cargo.lock"
  cache-directories:
    description: >-
      Extra newline-separated paths to add to the registry entry (bounded, lockfile-keyed) — suited
      to vendored/download caches that track the lockfiles.
    required: false
    default: ""
  stats:
    description: >-
      Record what the restore delivered (hit kind, restored sizes) for the `timing-report` Cache
      section. Off by default because it walks the restored trees with `du`, which is seconds on a
      multi-gigabyte target. Worth it while tuning a pipeline: a cache that restores but whose
      artifacts are not reusable reports success at every step and simply costs minutes, and the hit
      kind plus the size is what separates that from a genuinely cold run.
    required: false
    default: "false"

outputs:
  target-cache-hit:
    description: '"true" when the target entry restored from its exact key. Empty under local-target, which restores nothing.'
    value: ${{ steps.target.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # Incremental compilation is pure cost in CI (no edit→recompile loop) and is what balloons target/
    # — gigabytes of codegen units + dep-graph data that are never reused across runs. Defaulting it
    # off is the single biggest size reduction and is what makes caching target/ safe; a consumer who
    # knows a variant build benefits can still set CARGO_INCREMENTAL and have it honoured.
    - name: Configure cargo for CI + compute cache keys
      id: meta
      shell: bash
      env:
        EXTRA_DIRS: ${{ inputs.cache-directories }}
        LOCAL_TARGET: ${{ inputs.local-target }}
        CACHE_TARGET: ${{ inputs.cache-target }}
        PREFIX: ${{ inputs.prefix }}
      run: |
        set -euo pipefail
        # Default these only when the consumer hasn't set them — an explicit CARGO_INCREMENTAL
        # (workflow/job env) is obeyed and left to flow through (e.g. into the Docker actions).
        if [ -z "${CARGO_INCREMENTAL:-}" ]; then echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"; fi
        if [ -z "${CARGO_TERM_COLOR:-}" ]; then echo "CARGO_TERM_COLOR=always" >> "$GITHUB_ENV"; fi

        # Fold the toolchain into the TARGET key so a rustc bump can't reuse incompatible
        # artifacts. The registry (downloads only) is toolchain-independent.
        if command -v rustc >/dev/null 2>&1; then
          rust=$(rustc -V | sha256sum | cut -c1-12)
        else
          rust=norustc
        fi
        echo "rust=$rust" >> "$GITHUB_OUTPUT"

        # "auto" reads a marker the host places beside the work directory: the runner does not pass
        # its own env into a job container, but the work tree is mounted into it.
        work=""
        [ -n "${RUNNER_WORKSPACE:-}" ] && work="$(dirname "$RUNNER_WORKSPACE")"
        local_target=false
        case "$LOCAL_TARGET" in
          true) local_target=true ;;
          auto)
            if [ "${RUST_CI_LOCAL_TARGET:-}" = "1" ]; then
              local_target=true
            elif [ -n "$work" ] && [ -e "$work/.rust-ci-local-target" ]; then
              local_target=true
            fi
            ;;
        esac
        # No work tree means nowhere safe to put it; fall back to the transfer.
        # Without cache-target there is no target entry at all; stay off so the
        # outputs and the stats note never claim a mode that did not run.
        { [ -n "$work" ] && [ "$CACHE_TARGET" = "true" ]; } || local_target=false
        echo "local_target=$local_target" >> "$GITHUB_OUTPUT"
        if [ "$local_target" = true ]; then
          echo "local_target_dir=$work/.rust-ci-target/$PREFIX" >> "$GITHUB_OUTPUT"
        fi

        # Cargo's DOWNLOAD cache — registry index + .crate tarballs + git db. Never registry/src:
        # cargo re-extracts it from the tarballs, so caching it is pure duplication (it roughly
        # doubles the registry footprint for no benefit). The cargo home comes from CARGO_HOME when
        # set — container images that bake the toolchain elsewhere (e.g. /opt/cargo) rely on it,
        # and $HOME/.cargo would cache a directory cargo never touches.
        CARGO_DIR="${CARGO_HOME:-$HOME/.cargo}"
        {
          echo 'registry_paths<<__PATHS__'
          echo "$CARGO_DIR/registry/index"
          echo "$CARGO_DIR/registry/cache"
          echo "$CARGO_DIR/git/db"
          if [ -n "$EXTRA_DIRS" ]; then printf '%s\n' "$EXTRA_DIRS"; fi
          echo '__PATHS__'
        } >> "$GITHUB_OUTPUT"

    # Registry: restores here and auto-saves at job end (its post step runs even when nested in a
    # composite action). An exact-key save is skipped on a hit, so an unchanged Cargo.lock never
    # grows the cache; a changed lock seeds a fresh entry and the stale one is LRU-evicted — no
    # ratchet. `save: "false"` swaps in the restore-only variant of the same first-party action.
    - name: Cache cargo registry/git
      if: inputs.save == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ steps.meta.outputs.registry_paths }}
        key: ${{ inputs.prefix }}-${{ runner.os }}-registry-${{ hashFiles(inputs.lockfiles) }}
        restore-keys: |
          ${{ inputs.prefix }}-${{ runner.os }}-registry-

    - name: Restore cargo registry/git without saving
      if: inputs.save != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.meta.outputs.registry_paths }}
        key: ${{ inputs.prefix }}-${{ runner.os }}-registry-${{ hashFiles(inputs.lockfiles) }}
        restore-keys: |
          ${{ inputs.prefix }}-${{ runner.os }}-registry-

    # Target: restore-only (see the action description); `rust-cache-save` prunes and uploads under
    # the same key, handed over via $GITHUB_ENV so the two halves can never diverge.
    - name: Restore target
      if: inputs.cache-target == 'true' && steps.meta.outputs.local_target != 'true'
      id: target
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.target-dir }}
        key: ${{ inputs.prefix }}-${{ runner.os }}-target-${{ steps.meta.outputs.rust }}-${{ hashFiles(inputs.lockfiles) }}
        restore-keys: |
          ${{ inputs.prefix }}-${{ runner.os }}-target-${{ steps.meta.outputs.rust }}-
          ${{ inputs.prefix }}-${{ runner.os }}-target-

    - name: Hand the target key to rust-cache-save
      if: inputs.cache-target == 'true' && steps.meta.outputs.local_target != 'true'
      shell: bash
      env:
        KEY: ${{ inputs.prefix }}-${{ runner.os }}-target-${{ steps.meta.outputs.rust }}-${{ hashFiles(inputs.lockfiles) }}
        HIT: ${{ steps.target.outputs.cache-hit }}
        TARGET_DIR: ${{ inputs.target-dir }}
      run: |
        set -euo pipefail
        {
          echo "RUST_CI_TARGET_KEY=$KEY"
          echo "RUST_CI_TARGET_DIR=$TARGET_DIR"
          echo "RUST_CI_TARGET_HIT=${HIT:-false}"
        } >> "$GITHUB_ENV"

    # Deliberately hands over no key: that is what makes rust-cache-save skip its prune and upload,
    # and pruning here would delete artifacts the next build on this tree reuses.
    - name: Keep target on the runner
      if: inputs.cache-target == 'true' && steps.meta.outputs.local_target == 'true'
      shell: bash
      env:
        DIR: ${{ steps.meta.outputs.local_target_dir }}
      run: |
        set -euo pipefail
        mkdir -p "$DIR"
        {
          echo "CARGO_TARGET_DIR=$DIR"
          echo "RUST_CI_TARGET_DIR=$DIR"
          echo "RUST_CI_TARGET_LOCAL=1"
        } >> "$GITHUB_ENV"
        echo "rust-cache: target stays at $DIR ($(du -sh "$DIR" 2>/dev/null | cut -f1)); nothing transferred."

    # Opt-in, and last: the du walks cost seconds and must not sit between the
    # restore and the build for consumers who did not ask for them.
    - name: Record cache statistics
      if: inputs.stats == 'true'
      shell: bash
      env:
        TARGET_DIR: ${{ inputs.cache-target == 'true' && (steps.meta.outputs.local_target == 'true' && steps.meta.outputs.local_target_dir || inputs.target-dir) || '' }}
        TARGET_HIT: ${{ steps.target.outputs.cache-hit }}
        TARGET_KEY: ${{ inputs.prefix }}-${{ runner.os }}-target-${{ steps.meta.outputs.rust }}-${{ hashFiles(inputs.lockfiles) }}
        TARGET_LOCAL: ${{ steps.meta.outputs.local_target }}
        REGISTRY_DIRS: ${{ steps.meta.outputs.registry_paths }}
      run: bash "$GITHUB_ACTION_PATH/cache-stats.sh"
