name: Rust cache
description: >-
  Restore cargo's download cache and, on request, the build target directory through actions/cache.
  The registry entry restores here and saves at job end unless save is "false"; cache-registry "auto" skips it on a runner that offers a crates mirror.
  The target entry (cache-target) is restore-only here; the paired rust-cache-save action prunes and uploads it as the job's last step.
  CARGO_INCREMENTAL defaults to 0 when unset.

inputs:
  prefix:
    description: Cache-family name, so independent jobs (build, tauri) keep separate caches.
    required: false
    default: rust
  save:
    description: >-
      Also save the registry entry at job end (the actions/cache post step).
      Set "false" for restore-only consumers such as pull-request jobs reading a cache that a default-branch warmup job maintains; the target entry is restore-only here regardless.
    required: false
    default: "true"
  cache-registry:
    description: >-
      Restore the registry entry: "true", "false" or "auto", which skips it when RUST_CI_CRATES_MIRROR is non-empty in the job environment (docs/self-hosted.md), because a host mirror serves the same downloads without the transfer.
    required: false
    default: "true"
  cache-target:
    description: >-
      Also restore the build target/ directory (compiled dependencies between runs); off by default because registry/git alone is small and always safe.
      Saving the target back is the paired rust-cache-save action's job.
    required: false
    default: "false"
  local-target:
    description: >-
      Keep target/ on the runner between jobs instead of transferring it: "true", "false" or "auto", which follows RUST_CI_LOCAL_TARGET=1 in the job environment (docs/self-hosted.md).
      Requires cache-target and sets CARGO_TARGET_DIR outside the workspace; the README lists the rules.
    required: false
    default: "false"
  target-dir:
    description: Workspace-relative target directory to restore when cache-target is true (for example an out-of-workspace crate's target). Ignored when local-target is active.
    required: false
    default: target
  lockfiles:
    description: Glob of lockfile(s) whose hash keys the caches.
    required: false
    default: "**/Cargo.lock"
  cache-directories:
    description: >-
      Extra newline-separated paths to add to the registry entry (bounded, lockfile-keyed), suited to vendored or download caches that track the lockfiles.
    required: false
    default: ""
  stats:
    description: >-
      Record what the restore delivered (hit kind, restored sizes) in the step summary and for the timing-report Cache section.
      Off by default because it walks the restored trees with du, which takes seconds on a multi-gigabyte target.
    required: false
    default: "false"

outputs:
  registry-cached:
    description: '"true" when the registry entry went through actions/cache, "false" when cache-registry turned it off.'
    value: ${{ steps.meta.outputs.cache_registry }}
  target-cache-hit:
    description: '"true" when the target entry restored from its exact key. Empty under local-target, which restores nothing.'
    value: ${{ steps.target.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # Incremental compilation is pure cost in CI (no edit-recompile loop) and is what balloons target/:
    # gigabytes of codegen units + dep-graph data that are never reused across runs. Defaulting it
    # off is the single biggest size reduction and is what makes caching target/ safe; a consumer who
    # knows a variant build benefits can still set CARGO_INCREMENTAL and have it honoured.
    - name: Configure cargo for CI + compute cache keys
      id: meta
      shell: bash
      env:
        EXTRA_DIRS: ${{ inputs.cache-directories }}
        LOCAL_TARGET: ${{ inputs.local-target }}
        CACHE_TARGET: ${{ inputs.cache-target }}
        CACHE_REGISTRY: ${{ inputs.cache-registry }}
        PREFIX: ${{ inputs.prefix }}
      run: |
        set -euo pipefail
        # Default these only when the consumer hasn't set them: an explicit CARGO_INCREMENTAL
        # (workflow/job env) is obeyed and left to flow through (e.g. into the Docker actions).
        if [ -z "${CARGO_INCREMENTAL:-}" ]; then echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"; fi
        if [ -z "${CARGO_TERM_COLOR:-}" ]; then echo "CARGO_TERM_COLOR=always" >> "$GITHUB_ENV"; fi

        # Fold the toolchain into the TARGET key so a rustc bump can't reuse incompatible
        # artifacts. The registry (downloads only) is toolchain-independent.
        if command -v rustc >/dev/null 2>&1; then
          rust=$(rustc -V | sha256sum | cut -c1-12)
        else
          rust=norustc
        fi
        echo "rust=$rust" >> "$GITHUB_OUTPUT"

        # "auto" follows RUST_CI_LOCAL_TARGET=1 in the job env; a host whose work tree persists
        # sets it (docs/self-hosted.md).
        work=""
        [ -n "${RUNNER_WORKSPACE:-}" ] && work="$(dirname "$RUNNER_WORKSPACE")"
        local_target=false
        case "$LOCAL_TARGET" in
          true) local_target=true ;;
          false) ;;
          auto) [ "${RUST_CI_LOCAL_TARGET:-}" = "1" ] && local_target=true ;;
          *)
            echo "::error::rust-cache: local-target must be true, false or auto (got '$LOCAL_TARGET')"
            exit 1
            ;;
        esac
        # Without cache-target there is no target entry to keep: an explicit "true" is a
        # misconfiguration, "auto" stays off so no output claims a mode that did not run.
        if [ "$local_target" = true ] && [ "$CACHE_TARGET" != "true" ]; then
          if [ "$LOCAL_TARGET" = "true" ]; then
            echo "::error::rust-cache: local-target requires cache-target"
            exit 1
          fi
          local_target=false
        fi
        # No work tree means nowhere safe to put it; fall back to the transfer.
        if [ "$local_target" = true ] && [ -z "$work" ]; then
          echo "::notice::rust-cache: RUNNER_WORKSPACE is empty; transferring target/ instead of keeping it"
          local_target=false
        fi
        echo "local_target=$local_target" >> "$GITHUB_OUTPUT"
        if [ "$local_target" = true ]; then
          echo "local_target_dir=$work/.rust-ci-target/$PREFIX" >> "$GITHUB_OUTPUT"
        fi

        # "auto" follows RUST_CI_CRATES_MIRROR: a host that mirrors crates.io serves the
        # index and the tarballs at LAN speed, so the archive would only transfer bytes
        # the mirror already holds (docs/self-hosted.md).
        cache_registry=true
        case "$CACHE_REGISTRY" in
          true) ;;
          false) cache_registry=false ;;
          auto) [ -n "${RUST_CI_CRATES_MIRROR:-}" ] && cache_registry=false ;;
          *)
            echo "::error::rust-cache: cache-registry must be true, false or auto (got '$CACHE_REGISTRY')"
            exit 1
            ;;
        esac
        echo "cache_registry=$cache_registry" >> "$GITHUB_OUTPUT"
        [ "$cache_registry" = true ] || echo "rust-cache: registry entry skipped; the crates mirror in the job environment serves the downloads."

        # Cargo's DOWNLOAD cache: registry index + .crate tarballs + git db. Never registry/src:
        # cargo re-extracts it from the tarballs, so caching it is pure duplication (it roughly
        # doubles the registry footprint for no benefit). The cargo home comes from CARGO_HOME when
        # set; container images that bake the toolchain elsewhere (e.g. /opt/cargo) rely on it,
        # and $HOME/.cargo would cache a directory cargo never touches.
        CARGO_DIR="${CARGO_HOME:-$HOME/.cargo}"
        {
          echo 'registry_paths<<__PATHS__'
          echo "$CARGO_DIR/registry/index"
          echo "$CARGO_DIR/registry/cache"
          echo "$CARGO_DIR/git/db"
          if [ -n "$EXTRA_DIRS" ]; then printf '%s\n' "$EXTRA_DIRS"; fi
          echo '__PATHS__'
        } >> "$GITHUB_OUTPUT"

    # Registry: restores here and auto-saves at job end (its post step runs even when nested in a
    # composite action). An exact-key save is skipped on a hit, so an unchanged Cargo.lock never
    # grows the cache; a changed lock seeds a fresh entry and the stale one is removed after seven days without access, no
    # ratchet. `save: "false"` swaps in the restore-only variant of the same first-party action.
    - name: Cache cargo registry/git
      if: inputs.save == 'true' && steps.meta.outputs.cache_registry == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ steps.meta.outputs.registry_paths }}
        key: ${{ inputs.prefix }}-${{ runner.os }}-registry-${{ hashFiles(inputs.lockfiles) }}
        restore-keys: |
          ${{ inputs.prefix }}-${{ runner.os }}-registry-

    - name: Restore cargo registry/git without saving
      if: inputs.save != 'true' && steps.meta.outputs.cache_registry == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.meta.outputs.registry_paths }}
        key: ${{ inputs.prefix }}-${{ runner.os }}-registry-${{ hashFiles(inputs.lockfiles) }}
        restore-keys: |
          ${{ inputs.prefix }}-${{ runner.os }}-registry-

    # Target: restore-only (see the action description); `rust-cache-save` prunes and uploads under
    # the same key, handed over via $GITHUB_ENV so the two halves can never diverge.
    - name: Restore target
      if: inputs.cache-target == 'true' && steps.meta.outputs.local_target != 'true'
      id: target
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.target-dir }}
        key: ${{ inputs.prefix }}-${{ runner.os }}-target-${{ steps.meta.outputs.rust }}-${{ hashFiles(inputs.lockfiles) }}
        restore-keys: |
          ${{ inputs.prefix }}-${{ runner.os }}-target-${{ steps.meta.outputs.rust }}-
          ${{ inputs.prefix }}-${{ runner.os }}-target-

    - name: Hand the target key to rust-cache-save
      if: inputs.cache-target == 'true' && steps.meta.outputs.local_target != 'true'
      shell: bash
      env:
        KEY: ${{ inputs.prefix }}-${{ runner.os }}-target-${{ steps.meta.outputs.rust }}-${{ hashFiles(inputs.lockfiles) }}
        HIT: ${{ steps.target.outputs.cache-hit }}
        TARGET_DIR: ${{ inputs.target-dir }}
      run: |
        set -euo pipefail
        {
          echo "RUST_CI_TARGET_KEY=$KEY"
          echo "RUST_CI_TARGET_DIR=$TARGET_DIR"
          echo "RUST_CI_TARGET_HIT=${HIT:-false}"
        } >> "$GITHUB_ENV"

    # Deliberately hands over no key: that is what makes rust-cache-save skip its prune and upload,
    # and pruning here would delete artifacts the next build on this tree reuses.
    - name: Keep target on the runner
      if: inputs.cache-target == 'true' && steps.meta.outputs.local_target == 'true'
      shell: bash
      env:
        DIR: ${{ steps.meta.outputs.local_target_dir }}
      run: |
        set -euo pipefail
        mkdir -p "$DIR"
        echo "CARGO_TARGET_DIR=$DIR" >> "$GITHUB_ENV"
        echo "rust-cache: target stays at $DIR; nothing transferred."

    # Opt-in, and last: the du walks cost seconds and must not sit between the
    # restore and the build for consumers who did not ask for them.
    - name: Record cache statistics
      if: inputs.stats == 'true'
      shell: bash
      env:
        TARGET_DIR: ${{ inputs.cache-target == 'true' && (steps.meta.outputs.local_target == 'true' && steps.meta.outputs.local_target_dir || inputs.target-dir) || '' }}
        TARGET_HIT: ${{ steps.target.outputs.cache-hit }}
        TARGET_KEY: ${{ inputs.prefix }}-${{ runner.os }}-target-${{ steps.meta.outputs.rust }}-${{ hashFiles(inputs.lockfiles) }}
        TARGET_LOCAL: ${{ steps.meta.outputs.local_target }}
        REGISTRY_DIRS: ${{ steps.meta.outputs.registry_paths }}
        REGISTRY_CACHED: ${{ steps.meta.outputs.cache_registry }}
      run: bash "$GITHUB_ACTION_PATH/cache-stats.sh"
