name: Rust cache save
description: >-
  Prune target/ down to dependency artifacts and upload it under the exact key rust-cache computed.
  Call it as the last step of the job, because composite actions have no post hooks.
  Every step skips without a handed-over key or after an exact restore hit.
  Consumer-only jobs omit it or pass save "false".

inputs:
  save:
    description: >-
      Upload the pruned target.
      Pass the expression "github.ref == 'refs/heads/main'" for the restore-everywhere/save-on-main pattern.
    required: false
    default: "true"
  working-directory:
    description: Workspace directory whose `cargo metadata` names the members to prune.
    required: false
    default: "."
  stats:
    description: >-
      Record the pruned size, and the share the prune removed when `rust-cache` measured the tree before the build, for the `timing-report` Cache section.
      Pair it with `stats: "true"` on `rust-cache`.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Dependency artifacts are the cache's value; everything else is rebuilt or relinked on any
    # commit and only grows the archive plus the tar/zstd staging that can fill the runner disk.
    # The prune step is cargo-metadata-driven: for non-cargo cache families
    # (no Cargo.toml in the workspace, e.g. a C++ build tree like pdfium's
    # out/) it logs and saves the directory unpruned instead of failing.
    - name: Prune target to dependency artifacts
      if: ${{ inputs.save == 'true' && env.RUST_CI_TARGET_KEY != '' && env.RUST_CI_TARGET_HIT != 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bash "$GITHUB_ACTION_PATH/prune-target.sh"

    - name: Save target
      if: ${{ inputs.save == 'true' && env.RUST_CI_TARGET_KEY != '' && env.RUST_CI_TARGET_HIT != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: ${{ env.RUST_CI_TARGET_DIR }}
        key: ${{ env.RUST_CI_TARGET_KEY }}

    # After the save, so the du never delays the upload. Reads the pre-build
    # size rust-cache left in the environment; without it only the pruned size
    # is reported rather than a ratio against nothing.
    - name: Record cache statistics
      if: ${{ inputs.stats == 'true' && env.RUST_CI_TARGET_KEY != '' }}
      shell: bash
      env:
        TARGET_DIR: ${{ env.RUST_CI_TARGET_DIR }}
      run: bash "$GITHUB_ACTION_PATH/cache-stats.sh"
