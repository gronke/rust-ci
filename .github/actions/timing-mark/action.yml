name: Timing mark
description: >-
  Record the start of a stage for the timing report.
  Place one call per stage as its own step immediately before the work it names; the stage ends at the next mark or at timing-report.
  It appends and never fails a job: a mark placed before timing-start, or without one, still records.

inputs:
  name:
    description: >-
      Stage name as it should read in the summary table.
      Tabs and newlines are collapsed to spaces.
    required: true

runs:
  using: composite
  steps:
    - name: Mark stage
      shell: bash
      env:
        STAGE: ${{ inputs.name }}
      run: bash "$GITHUB_ACTION_PATH/timing-mark.sh"
