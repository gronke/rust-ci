name: sccache
description: >-
  Install a pinned sccache as RUSTC_WRAPPER.
  The backend is whatever SCCACHE_* the job environment carries; sccache reads it itself.
  "auto" is a no-op without one, so one workflow runs unchanged on hosted and self-hosted runners (docs/self-hosted.md).
  CARGO_INCREMENTAL defaults to 0 because incremental output is uncacheable; an explicit value is obeyed.
  Linux only; the sealed Docker actions are untouched.

inputs:
  mode:
    description: >-
      "auto" activates when a non-empty SCCACHE_* variable is set in the job environment, "on" activates regardless (and warns without a backend), "off" changes nothing.
      "gha" uses GitHub's cache service as the backend, the choice for hosted runners; it is explicit on purpose because it exports ACTIONS_RUNTIME_TOKEN (masked) and ACTIONS_RESULTS_URL into the job environment and spends the repository's cache pool (see the README).
    required: false
    default: auto
  namespace:
    description: >-
      A path below the configured backend's key prefix, `release/linux-amd64` for example, so tiers or platforms share one backend without sharing objects.
      Segments of A-Za-z0-9._- joined by "/"; applied to whichever backend the job environment configures (the S3, GCS, Azure, WebDAV, Redis, Memcached or OSS key prefix, the gha version, or a subdirectory of SCCACHE_DIR) and ignored without one.
      A namespace separates objects, not writers.
    required: false
    default: ""
  server-startup-timeout-ms:
    description: >-
      How long the sccache client waits for its server to start, in milliseconds, written as server_startup_timeout_ms into a configuration file the action points SCCACHE_CONF at.
      The server checks its storage before it answers, and a remote backend busy with other jobs' servers can take longer than sccache's ten-second default.
      A job that sets SCCACHE_CONF itself keeps its own file.
    required: false
    default: "30000"
  version:
    description: sccache release to install, pinned together with the checksums below.
    required: false
    default: "0.17.0"
  sha256-x86_64:
    description: SHA256 of the x86_64-unknown-linux-musl release archive.
    required: false
    default: "67c4a96dd237c1f518f6b36083f270f9976d516f1e57fce891755ea782e50006"
  sha256-aarch64:
    description: SHA256 of the aarch64-unknown-linux-musl release archive.
    required: false
    default: "821a86343191aa1cbab74bd42f9e93c9a63bf85e4742945f40d3ae84193c1c77"

outputs:
  active:
    description: '"true" when sccache was installed and RUSTC_WRAPPER exported.'
    value: ${{ steps.setup.outputs.active }}
  bin:
    description: Absolute path of the installed sccache binary (empty when inactive).
    value: ${{ steps.setup.outputs.bin }}

runs:
  using: composite
  steps:
    # The runner injects the cache-service endpoint and token only into
    # JavaScript action steps; this exports them for the compile processes.
    # Gated on the explicit mode. The token can write this run's artifacts
    # and caches, so putting it into the job env is a deliberate opt-in.
    - name: Expose the cache-service runtime for the gha backend
      if: inputs.mode == 'gha'
      uses: actions/github-script@v9
      with:
        script: |
          const token = process.env.ACTIONS_RUNTIME_TOKEN
          const url = process.env.ACTIONS_RESULTS_URL
          if (!token || !url) {
            core.setFailed('sccache: the runner exposed no cache-service runtime (ACTIONS_RESULTS_URL / ACTIONS_RUNTIME_TOKEN)')
          } else {
            core.setSecret(token)
            core.exportVariable('ACTIONS_RESULTS_URL', url)
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', token)
            // The backend speaks the twirp v2 protocol only when the runner's
            // flag travels along; without it, reads degrade to clean misses
            // and every write errors against the retired v1 API.
            for (const k of ['ACTIONS_CACHE_SERVICE_V2', 'ACTIONS_CACHE_URL']) {
              if (process.env[k]) core.exportVariable(k, process.env[k])
            }
          }

    - name: Install sccache
      id: setup
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        NAMESPACE: ${{ inputs.namespace }}
        VERSION: ${{ inputs.version }}
        STARTUP_TIMEOUT_MS: ${{ inputs.server-startup-timeout-ms }}
        SHA256_X86_64: ${{ inputs.sha256-x86_64 }}
        SHA256_AARCH64: ${{ inputs.sha256-aarch64 }}
      run: bash "$GITHUB_ACTION_PATH/sccache.sh"
