name: Install Rust toolchain
description: >-
  Install a Rust toolchain via rustup and put cargo's bin directory on PATH for later steps.
  Installs the toolchain, then the requested components and targets.
  Works on Linux, macOS and Windows, and bootstraps rustup on a runner without it.

inputs:
  toolchain:
    description: Toolchain passed to rustup (e.g. stable, 1.77.2). It becomes the default toolchain.
    required: false
    default: stable
  components:
    description: Space-separated rustup components to add (e.g. "rustfmt clippy").
    required: false
    default: ""
  targets:
    description: Space-separated rustup targets to add (e.g. "x86_64-apple-darwin").
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        COMPONENTS: ${{ inputs.components }}
        TARGETS: ${{ inputs.targets }}
      run: bash "$GITHUB_ACTION_PATH/install-toolchain.sh"
