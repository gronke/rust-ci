name: Cargo install (shared cache, sealed)
description: >-
  Install a cargo-based CLI tool into a shared, hardened cargo cache so later sealed runs can use it.
  With `url`, the tool comes from a pinned prebuilt release instead of a compile; in host mode, an exact version that later steps would run already is skipped.

inputs:
  tool:
    description: >-
      Crate name to install (e.g. cargo-audit).
      Validated on the host against ^[A-Za-z0-9][A-Za-z0-9_-]*$ and rejected otherwise, so a crafted value cannot smuggle a leading flag or shell metacharacters.
    required: true
  version:
    description: >-
      Version or version requirement passed as `--version` (e.g. 0.21.2 or ^0.21), validated to a conservative charset.
      Empty (default) installs the latest; with `url`, an exact version is required.
    required: false
    default: ""
  url:
    description: >-
      Release archive (.tar.gz) of a prebuilt static binary, with {version} and {target} placeholders ({target} is x86_64-unknown-linux-musl or aarch64-unknown-linux-musl).
      Set, it replaces the compile: downloaded on the runner, verified against the sha256 pins and the version, and the binary lands in <cargo-cache>/bin in both modes.
    required: false
    default: ""
  sha256-x86_64:
    description: SHA256 of the x86_64-unknown-linux-musl archive; required with `url`.
    required: false
    default: ""
  sha256-aarch64:
    description: SHA256 of the aarch64-unknown-linux-musl archive; required with `url`.
    required: false
    default: ""
  bin:
    description: Name of the tool's binary, in the archive and on PATH; defaults to the tool name.
    required: false
    default: ""
  args:
    description: >-
      Extra flags appended to `cargo install` (e.g. --no-default-features --features rustls-tls), word-split inside the container and never on the host shell in docker mode.
      Do not put the crate name or --version here.
    required: false
    default: ""
  locked:
    description: Append --locked (honour the crate's bundled Cargo.lock). Default "true".
    required: false
    default: "true"
  docker:
    description: >-
      Install inside the sealed container (default).
      Set "false" to install on the host runner, where <cargo-cache>/bin joins PATH for later steps and an exact version counts as installed when the binary later steps would run (the cache's first, then PATH) reports it.
    required: false
    default: "true"
  image:
    description: CI image (Rust toolchain). Use the same image in cargo-use (ABI).
    required: false
    default: rust-ci:latest
  cargo-cache:
    description: >-
      Host dir mounted RW as CARGO_HOME (/cache/cargo); the tool installs to its bin/ and is shared with later sealed runs.
      Relative to working-directory, or absolute. Reuse the same value in cargo-use.
    required: false
    default: .cargo-cache
  working-directory:
    description: Directory the action runs from (its repo is mounted read-only).
    required: false
    default: "."
  env-include:
    description: Regex (POSIX ERE) of runner variable names to forward, anchored full-name; see docs/sealed-builds.md.
    required: false
    default: "CARGO_.*"
  env-exclude:
    description: Regex (POSIX ERE) of names to drop from the included set (exclusion wins); see docs/sealed-builds.md.
    required: false
    default: ""
  env:
    description: Literal KEY=VALUE lines forwarded verbatim; a bare NAME line forwards that variable from the runner environment; see docs/sealed-builds.md.
    required: false
    default: ""

outputs:
  bin-dir:
    description: Host path to the shared bin dir holding the installed tool (<cargo-cache>/bin).
    value: ${{ steps.validate.outputs.bin-dir }}
  installed:
    description: '"true" when this step installed the tool, "false" when host mode found the exact version present already.'
    value: ${{ steps.prebuilt.outputs.installed || steps.sealed.outputs.installed || steps.host.outputs.installed }}

runs:
  using: composite
  steps:
    # Host-side gate, BEFORE either branch. The tool/version inputs reach this
    # script only as env vars (never as ${{ }} interpolated into the run body), so
    # they can't become host shell code; the allowlist is belt-and-braces on top:
    # it rejects a name that could smuggle a leading flag or a metacharacter into
    # any later cargo invocation. `args` is intentionally NOT allowlisted (flags are
    # open-ended); it is contained instead, word-split only inside the container.
    - name: validate inputs
      id: validate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TOOL: ${{ inputs.tool }}
        VERSION: ${{ inputs.version }}
        BIN: ${{ inputs.bin }}
        URL: ${{ inputs.url }}
        SHA256_X86_64: ${{ inputs.sha256-x86_64 }}
        SHA256_AARCH64: ${{ inputs.sha256-aarch64 }}
        CARGO_CACHE: ${{ inputs.cargo-cache }}
      run: |
        set -euo pipefail
        # Allowlist patterns live in variables and are matched with [[ =~ ]], so no
        # glob/redirection metacharacter is ever seen by the shell tokenizer (a
        # bracket like [..<>..] in a `case` glob is NOT shielded: bash tokenizes
        # the <> as a redirection). The tool must start alphanumeric (so a value
        # can't pose as a leading flag); the version charset is deliberately narrow.
        tool_re='^[A-Za-z0-9][A-Za-z0-9_-]*$'
        if [[ ! "$TOOL" =~ $tool_re ]]; then
          echo "::error::cargo-install: invalid tool name '$TOOL' (allowed: A-Za-z0-9 _ -, leading alphanumeric)"; exit 1
        fi
        bin="${BIN:-$TOOL}"
        if [[ ! "$bin" =~ $tool_re ]]; then
          echo "::error::cargo-install: invalid binary name '$bin' (allowed: A-Za-z0-9 _ -, leading alphanumeric)"; exit 1
        fi
        if [ -n "${VERSION:-}" ]; then
          ver_re='^[0-9A-Za-z.+~^=-]+$'   # exact version or a single ^/~/= requirement
          if [[ ! "$VERSION" =~ $ver_re ]]; then
            echo "::error::cargo-install: invalid version '$VERSION' (use an exact version or a single ^/~/= requirement)"; exit 1
          fi
        fi
        if [ -n "${URL:-}" ]; then
          exact_re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          [[ "${VERSION:-}" =~ $exact_re ]] || { echo "::error::cargo-install: url needs an exact version (got '${VERSION:-}')"; exit 1; }
          # The placeholders are the only braces; the rest is a plain https URL.
          rest="${URL//\{version\}/}"
          rest="${rest//\{target\}/}"
          url_re='^https://[A-Za-z0-9./_~%+:=@-]+$'
          [[ "$rest" =~ $url_re ]] || { echo "::error::cargo-install: url '$URL' is not an https URL with {version} and {target} placeholders"; exit 1; }
          sha_re='^[a-f0-9]{64}$'
          [[ "$SHA256_X86_64" =~ $sha_re ]] && [[ "$SHA256_AARCH64" =~ $sha_re ]] \
            || { echo "::error::cargo-install: url needs sha256-x86_64 and sha256-aarch64, 64 hex digits each"; exit 1; }
        fi
        # Relative to the working directory or absolute, the same rule as seal.sh.
        case "$CARGO_CACHE" in
          /*) cache="${CARGO_CACHE%/}" ;;
          *) cache="$PWD/${CARGO_CACHE%/}" ;;
        esac
        {
          printf 'bin-dir=%s/bin\n' "${CARGO_CACHE%/}"
          printf 'bin=%s\n' "$bin"
          printf 'cache=%s\n' "$cache"
        } >> "$GITHUB_OUTPUT"

    - name: install (prebuilt)
      id: prebuilt
      if: ${{ inputs.url != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BIN: ${{ steps.validate.outputs.bin }}
        VERSION: ${{ inputs.version }}
        URL: ${{ inputs.url }}
        SHA256_X86_64: ${{ inputs.sha256-x86_64 }}
        SHA256_AARCH64: ${{ inputs.sha256-aarch64 }}
        BIN_DIR: ${{ steps.validate.outputs.cache }}/bin
        ON_HOST: ${{ inputs.docker != 'true' }}
      run: bash "$GITHUB_ACTION_PATH/prebuilt.sh"

    - name: install (sealed)
      id: sealed
      if: ${{ inputs.docker == 'true' && inputs.url == '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IMAGE: ${{ inputs.image }}
        CARGO_CACHE: ${{ inputs.cargo-cache }}
        TOOL: ${{ inputs.tool }}
        VERSION: ${{ inputs.version }}
        ARGS: ${{ inputs.args }}
        LOCKED: ${{ inputs.locked }}
        ENV_INCLUDE: ${{ inputs.env-include }}
        ENV_EXCLUDE: ${{ inputs.env-exclude }}
        INPUT_ENV: ${{ inputs.env }}
      run: |
        set -euo pipefail
        # shellcheck source=/dev/null
        source "$GITHUB_ACTION_PATH/../_lib/seal.sh"
        # Networked: downloading crates needs egress. seal.sh still applies
        # --cap-drop=ALL, no-new-privileges, non-root and repo-RO (OFFLINE toggles
        # ONLY --network=none), so the install (and the build.rs / proc-macros it
        # runs) is contained even while networked. No TARGET_DIR: `cargo install`
        # builds in its own temp dir, not the workspace target/.
        export OFFLINE=false
        # TOOL/VERSION/ARGS/LOCKED aren't CARGO_* (env-include won't forward them);
        # hand them to the in-container script.
        export SEAL_PASS="TOOL VERSION ARGS LOCKED"
        seal_run bash /cicd/cargo-install.sh
        echo "installed=true" >> "$GITHUB_OUTPUT"

    - name: install (host)
      id: host
      if: ${{ inputs.docker != 'true' && inputs.url == '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CARGO_CACHE_DIR: ${{ steps.validate.outputs.cache }}
        BIN: ${{ steps.validate.outputs.bin }}
        TOOL: ${{ inputs.tool }}
        VERSION: ${{ inputs.version }}
        ARGS: ${{ inputs.args }}
        LOCKED: ${{ inputs.locked }}
      run: |
        set -euo pipefail
        # shellcheck source=present.sh disable=SC1091
        source "$GITHUB_ACTION_PATH/present.sh"
        # An exact version counts as installed when the binary later steps run,
        # the cache's ahead of PATH (a runner image's baked tool), reports it;
        # a requirement like ^0.21 always asks cargo.
        if [[ "${VERSION:-}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
          && found=$(tool_found "$BIN" "$VERSION" "$CARGO_CACHE_DIR/bin"); then
          echo "cargo-install: $BIN $VERSION is present at $found; nothing to install."
          echo "installed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Host mode: a plain `cargo install` on the runner. NOTE: ARGS word-splits on
        # the host shell here, so use docker mode (the default) for untrusted input.
        # CARGO_HOME points at the same shared dir so the binary lands where cargo-use
        # (host or docker) expects it. Reuses the same script as the sealed path.
        CARGO_HOME="$CARGO_CACHE_DIR" bash "$GITHUB_ACTION_PATH/cargo-install.sh"
        echo "installed=true" >> "$GITHUB_OUTPUT"

    # Later steps call the tool directly (`cargo nextest run`), not only through
    # cargo-use; a sealed container never reads the runner's PATH.
    - name: put the tools on PATH (host)
      if: ${{ inputs.docker != 'true' }}
      shell: bash
      env:
        BIN_DIR: ${{ steps.validate.outputs.cache }}/bin
      run: echo "$BIN_DIR" >> "$GITHUB_PATH"
