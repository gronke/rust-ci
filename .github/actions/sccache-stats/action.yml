name: sccache statistics
description: >-
  Record what sccache delivered (compile requests, hits, misses, errors) as
  `cache.sccache.*` facts for the timing-report Cache section, plus the raw
  `sccache --show-stats` output in a log group. Run it as a late job step,
  after the builds it accounts for; composite actions have no post hooks,
  the same split as rust-cache/rust-cache-save.

  A no-op when sccache is not active. Statistics never fail a job: a broken
  stats query costs the numbers, not the build.

runs:
  using: composite
  steps:
    - name: Record sccache statistics
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/sccache-stats.sh"
