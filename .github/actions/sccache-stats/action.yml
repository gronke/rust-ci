name: sccache statistics
description: >-
  Record sccache's compile requests, hits, misses and errors as cache.sccache.* facts in the step summary and the timing-report Cache section, plus the raw sccache --show-stats output in a log group.
  Run it late, after the builds it accounts for; composite actions have no post hooks.
  A no-op unless RUSTC_WRAPPER is an sccache binary; statistics never fail a job.

runs:
  using: composite
  steps:
    - name: Record sccache statistics
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/sccache-stats.sh"
