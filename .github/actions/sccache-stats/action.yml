name: sccache statistics
description: >-
  Record what sccache delivered (compile requests, hits, misses, errors) as cache.sccache.* facts for the timing-report Cache section, plus the raw sccache --show-stats output in a log group.
  Run it as a late job step, after the builds it accounts for, because composite actions have no post hooks.
  A no-op unless RUSTC_WRAPPER is an sccache binary; statistics never fail a job.

runs:
  using: composite
  steps:
    - name: Record sccache statistics
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/sccache-stats.sh"
