name: Publish dry-run (Docker, sealed)
description: >-
  Gate a crates.io release in two halves: a networked prep runs the publish checks without a build (cargo fetch warm-up, tag/version assert, not-already-published probe, cargo publish --dry-run --no-verify), then the verify-build runs sealed (cargo package --offline under --network=none) so the dependency build.rs and proc-macros it compiles cannot reach the network.
  Requires a committed Cargo.lock.

inputs:
  image:
    description: CI image (Rust toolchain + jq + curl).
    required: false
    default: rust-ci:latest
  working-directory:
    description: Crate/workspace directory (mounted read-only).
    required: false
    default: "."
  target-dir:
    description: Host dir for cargo target (read-write; also carries the prep-to-verify handoff).
    required: false
    default: target
  cargo-cache:
    description: Host dir for CARGO_HOME (read-write; warmed by the prep step).
    required: false
    default: .cargo-cache
  package:
    description: Package name to check (required for a workspace with more than one member).
    required: false
    default: ""
  expected-version:
    description: Version the crate must declare (else derived from a <package>-v* or v* tag).
    required: false
    default: ""
  require-deps-published:
    description: >-
      Gate the package's workspace path dependencies: each must already be published on crates.io at the version the manifest requires, so a multi-crate release fails early when tagged out of order.
    required: false
    default: "false"
  git-token:
    description: >-
      Token for cloning private git dependencies during the prep fetch.
      Masked and forwarded to the container's git as x-access-token; leave empty for public deps.
    required: false
    default: ""
  env-include:
    description: Regex (POSIX ERE) of runner variable names to forward, anchored full-name; see docs/sealed-builds.md.
    required: false
    default: "CARGO_.*"
  env-exclude:
    description: Regex (POSIX ERE) of names to drop from the included set (exclusion wins); see docs/sealed-builds.md.
    required: false
    default: ""
  env:
    description: Literal KEY=VALUE lines forwarded verbatim; a bare NAME line forwards that variable from the runner environment; see docs/sealed-builds.md.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: publish dry-run (networked prep, then sealed verify)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IMAGE: ${{ inputs.image }}
        TARGET_DIR: ${{ inputs.target-dir }}
        CARGO_CACHE: ${{ inputs.cargo-cache }}
        INPUT_PACKAGE: ${{ inputs.package }}
        INPUT_EXPECTED_VERSION: ${{ inputs.expected-version }}
        INPUT_REQUIRE_DEPS_PUBLISHED: ${{ inputs.require-deps-published }}
        GIT_TOKEN: ${{ inputs.git-token }}
        ENV_INCLUDE: ${{ inputs.env-include }}
        ENV_EXCLUDE: ${{ inputs.env-exclude }}
        INPUT_ENV: ${{ inputs.env }}
      run: |
        set -euo pipefail
        # shellcheck source=/dev/null
        source "$GITHUB_ACTION_PATH/../_lib/seal.sh"

        # Optional private-git token: mask it and forward as one explicit env-file line.
        token_line=""
        if [ -n "${GIT_TOKEN:-}" ]; then
          printf '::add-mask::%s\n' "$GIT_TOKEN"
          token_line="CICD_GIT_TOKEN=$GIT_TOKEN"
        fi

        # 1) Networked prep: cargo fetch + metadata + tag<->version + crates.io probe.
        # The inputs and the tag ref aren't CARGO_* (env-include won't forward them);
        # hand them to the prep script, the masked token as the one computed line.
        export OFFLINE=false
        export SEAL_PASS="INPUT_PACKAGE INPUT_EXPECTED_VERSION INPUT_REQUIRE_DEPS_PUBLISHED GITHUB_REF"
        export EXTRA_ENV="$token_line"
        seal_run bash /cicd/prep.sh

        # 2) Sealed verify-build: cargo package --offline, --network=none; it reads the
        # prep's marker file, not the inputs.
        export OFFLINE=true
        export SEAL_PASS="" EXTRA_ENV=""
        seal_run bash /cicd/verify.sh
